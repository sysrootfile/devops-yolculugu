name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v5

      - name: Node kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: İçerik testleri
        run: npm test

      - name: Siteyi derle
        run: npm run build

      - name: Üretilen sayfaları doğrula
        run: |
          test -d dist || { echo "dist/ yok!"; exit 1; }
          test -f dist/index.html || { echo "ana sayfa üretilmemiş!"; exit 1; }
          echo "✅ $(find dist -name 'index.html' | wc -l) sayfa üretildi"

      - name: Pages artifact'ını sakla
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/

  deploy-pages:
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: Build artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: E2E raporunu siteye kopyala
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: dist/test-raporu

      - name: Pages artifact'ını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        name: GitHub Pages'e dağıt
        uses: actions/deploy-pages@v4

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v5

      - name: Node kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Chromium kur
        run: npx playwright install chromium --with-deps

      - name: Siteyi derle
        run: npm run build

      - name: E2E testleri
        run: npx playwright test

      - name: HTML test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Repoyu indir
        uses: actions/checkout@v5

      - name: GHCR'a giriş yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: İmajı derle ve GHCR'a gönder
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.description=DevOps Yolculuğu — interaktif öğrenme platformu

